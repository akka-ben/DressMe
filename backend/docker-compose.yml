version: "3.9"

services:
  backend:
    build: .
    container_name: dressme-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:6
    container_name: dressme-mongo
    ports:
      - "27017:27017"

  redis:
    image: redis:7
    container_name: dressme-redis
    ports:
      - "6379:6379"


  mailpit:
    image: axllent/mailpit
    container_name: dressme-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"